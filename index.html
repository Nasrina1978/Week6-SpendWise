<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise - Smart Budget Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>💰 SpendWise</h1>
            <p>Your Smart Budget Companion</p>
        </header>
        <main>
            <div class="card">
                <h2>Welcome to SpendWise</h2>
                <p>Open console (F12) and click Start Budgeting.</p>
                <ol>
                    <li>Open browser console</li>
                    <li>Refresh page</li>
                    <li>Enter budget & expenses</li>
                    <li>View results in console</li>
                </ol>
                <button id="startBtn">Start Budgeting</button>
            </div>
            <div class="card result-card">
                <h3>Your Budget Summary</h3>
                <div id="display"><p>Results will appear here...</p></div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
